<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>kt’s goal report</title>
<style>
:root{
  --bg:#EEF2E6; --panel:#F8FAF3; --ink:#1F2A22; --soft:#5E6B60;
  --leaf:#2F6B3F; --beet:#9B2F4F; --turmeric:#D9A21B; --empty:#D6DDCB; --sky:#2F6A8F;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#161C17; --panel:#1F2720; --ink:#E8EDE3; --soft:#9AA79B;
    --leaf:#6FBF7F; --beet:#E07A98; --turmeric:#E8BC4D; --empty:#2E3830; --sky:#7DB8DC;}
}
*{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Avenir Next","Avenir",-apple-system,system-ui,sans-serif;line-height:1.4}
main{max-width:640px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:2.1rem;font-weight:700;margin:0;letter-spacing:-.02em}
h2{font-size:1.25rem;font-weight:700;margin:22px 0 6px;text-wrap:balance}
.sub{color:var(--soft);margin:2px 0 0}
.panel{background:var(--panel);border-radius:14px;padding:22px 18px 24px;margin-top:0;text-align:center}
.panel p{margin:0 auto;max-width:34ch;color:var(--soft);text-wrap:balance}
.ele{display:block;width:100%;max-width:230px;height:auto;margin:4px auto 0}
.refresh{display:inline-flex;align-items:center;justify-content:center;gap:6px;margin-top:22px;padding:10px 22px;
  border-radius:999px;background:var(--leaf);color:var(--panel);font-weight:600;font-size:.9rem;text-decoration:none}
.refresh svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.refresh:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
/* .panel .tip so it beats the .panel p rule, which was zeroing the gap above the tip */
.panel .tip{font-size:.8rem;font-style:italic;color:var(--soft);margin:26px 0 0;max-width:100%}
</style>
</head>
