<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>kt’s goal report</title>
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="report.css">
<link rel="stylesheet" href="sheet.css">
</head>
<body>
<main id="app" class="page"><h1 class="page-title">kt’s goal report</h1><p class="page-subtitle">the page loaded, but scripts aren’t running in this viewer, so the charts can’t draw. open it with the kt health logger shortcut instead.</p></main>
<script>
window.onerror=function(msg,src,line){document.getElementById("app").innerHTML='<h1 class="page-title">kt’s goal report</h1><p class="page-subtitle">something in the report broke: '+msg+' (line '+line+')</p>';};
</script>
<script>
// the report shortcut opens this page as .../#d=<health-log.txt, base64 then url encoded>.
// everything after # stays on the phone and is never sent to the host.
let RAW = "";
try {
  // the data can arrive percent-encoded once, twice (some viewers re-encode the link), or not at all,
  // and base64 may end with "=" padding. undo every layer, keep only base64 letters, then re-pad.
  let enc = location.hash.replace(/^#d=/, "");
  for (let k = 0; k < 3 && /%[0-9a-f]{2}/i.test(enc); k++) { try { enc = decodeURIComponent(enc); } catch (e) { break; } }
  enc = enc.replace(/ /g, "+").replace(/-/g, "+").replace(/_/g, "/").replace(/[^A-Za-z0-9+/]/g, "");
  if (enc.length % 4 === 1) enc = enc.slice(0, -1);
  while (enc.length % 4) enc += "=";
  if (enc) RAW = new TextDecoder().decode(Uint8Array.from(atob(enc), ch => ch.charCodeAt(0)));
} catch (e) { RAW = ""; }

// each goal: [name shown, goal count, words that count toward it]
// matching is loose, so "cold 4m", "cold plunge" and "cold" all count as cold.
// order matters: the first match wins.
const CONSUMABLES = [
  ["probiotic",3,/probiotic|yogurt|kefir|kraut|kimchi|miso|kvass|acv/],
  ["cruciferous",2,/crucif|broccoli|cauli|brussels|kale|bok choy|arugula|cabbage|radish/],
  ["beans",3,/bean|legume|hummus|tofu|tempeh|edamame|lentil/],
  ["berries",1,/berr/],
  ["other fruit",3,/fruit/],
  ["fluids",1,/water|fluid|tea|\boz\b/],
  ["greens",2,/green/],
  ["other veg",2,/veg/],
  ["flax or chia",1,/flax|chia/],
  ["nuts and seeds",1,/nut|seed/],
  ["whole grains",3,/grain|oat|bread/],
  ["fiber 50g",1,/fiber|fibre/],
  ["omega-3",1,/omega|fish oil/]
];
const PRACTICES = [
  ["meditate",1,/medit|breath/],
  ["outside 1 hr",1,/outside|outdoor|sunlight/],
  ["10k steps",1,/step|10k/]
];
const WEEKLY = [
  ["cardio",5,/cardio|zone|z2/],
  ["cold 4m",3,/cold|plunge|ice/],
  ["heat 1 hr",1,/heat|sauna|hot yoga/],
  ["sprints",1,/sprint|sled|interval/]
];
const ALL=[...CONSUMABLES,...PRACTICES,...WEEKLY];

const pad=n=>String(n).padStart(2,"0");
const ds=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const today=new Date(); const T=ds(today);
const esc=s=>s.replace(/[&<>"]/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[ch]));

// the shortcut sends #d=<log> when health-log.txt exists, or #nofile when it doesn't
const NO_FILE = location.hash === "#nofile";
let text = RAW;
const NO_DATA = !NO_FILE && !/\d{4}-\d{2}-\d{2}/.test(text);
const EMPTY = NO_FILE || NO_DATA;

// line format: 2026-10-01 12:51 AM, meditate
// the log stores 24 hour time (HH:mm:ss). show it as 12 hour: "20:54:12" becomes "8:54:12 PM".
// also handles older entries like "08:05 AM" or "20:54", and ignores a trailing time zone like "-0400".
const niceTime=t=>{const m=t.trim().match(/^(\d{1,2}):(\d{2})(?::(\d{2}))?\s*([ap]\.?m\.?)?/i);
  if(!m) return t.trim();
  let hr=+m[1]; const ap=m[4]?m[4].replace(/\./g,"").toUpperCase():(hr>=12?"PM":"AM");
  if(!m[4]) hr=hr%12||12;
  return `${hr}:${m[2]}${m[3]?":"+m[3]:""} ${ap}`;};
const counts={}, todayLog=[], unknown={};
text.split(/\r?\n/).forEach(line=>{
  // line format: timestamp, item, id, location. id and location are optional and ignored here.
  const m=line.trim().match(/^(\d{4}-\d{2}-\d{2})\s*([^,]*),\s*([^,]+?)\s*(?:,.*)?$/);
  if(!m) return;
  const [,d,time,rawItem]=m; const item=rawItem.trim().toLowerCase();
  const hit=ALL.find(([,,re])=>re.test(item));
  if(!hit){unknown[item]=(unknown[item]||0)+1; return;}
  (counts[d]??={}); counts[d][hit[0]]=(counts[d][hit[0]]||0)+1;
  if(d===T) todayLog.push([niceTime(time),rawItem.trim()]);
});
const c=(d,k)=>(counts[d]&&counts[d][k])||0;
const scoreOf=(list,d)=>list.reduce((s,[k,g])=>s+Math.min(c(d,k),g),0)/list.reduce((s,[,g])=>s+g,0);

// tapping log opens the stepper sheet. ok sends one line per serving to the logger shortcut,
// which writes them to health-log.txt and reopens this report. match the logger's exact name.
const LOGGER_NAME="kt health data processor";
const MAX_SERVINGS=9;
// these are the exact words written to the log, same as the lists in the logger shortcut
const LOG_GROUPS=[
  ["consumables",["beans","whole grains","probiotic","other fruit","greens","other veg","cruciferous",
    "berries","flax or chia","nuts & seeds","50g fiber","60oz fluids","omega-3 2g"]],
  ["practices",["10k steps","1h outside","meditate","cardio","cold 4m","heat 1h","sprints"]]
];
const LOG_ITEMS=LOG_GROUPS.flatMap(([,items])=>items);
const made=today.toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"});
let h=`<div class="report-header"><div class="report-header-text"><h1 class="page-title">kt’s goal report</h1><p class="page-subtitle">${today.toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric"})}, as of ${made}</p></div><button type="button" class="log-button" data-act="open" aria-haspopup="dialog" aria-label="log something"><svg class="log-button-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>log</button></div>`;
// offline notice: the page itself can load offline (saved copy, see sw.js); this tells her why it looks the same
h+=`<div class="offline-banner" id="offline" role="status" hidden><img class="offline-banner-image" src="elephant.webp" alt="" width="84" height="98"><div class="offline-banner-text"><b class="offline-banner-title">oops. the herd lost its signal…</b><span class="offline-banner-message">you’re offline, but your report is up to date and logging still works.</span></div></div>`;
if(EMPTY){
  h+= NO_FILE
    ? `<div class="empty-state" role="status"><b class="empty-state-title">health-log.txt file does not exist</b><span class="empty-state-message">logging something will create it.</span></div>`
    : `<div class="empty-state" role="status"><img class="empty-state-image" src="nodata-elephant.webp" alt="" width="180" height="210"><b class="empty-state-title">no data</b><span class="empty-state-message">tap log to add your first entry.</span></div>`;
} else {
h+=`<div class="scores"><div class="score"><b class="score-value">${Math.round(scoreOf(CONSUMABLES,T)*100)}%</b><span class="score-label">consumables today</span></div><div class="score"><b class="score-value score-value--practice">${Math.round(scoreOf(PRACTICES,T)*100)}%</b><span class="score-label">practices today</span></div></div>`;

const met=[...CONSUMABLES,...PRACTICES].filter(([k,g])=>c(T,k)>=g).length;
const GOALS=CONSUMABLES.length+PRACTICES.length;
const SHADOW=`<svg class="herd-shadow" viewBox="0 0 32 27" aria-hidden="true"><path class="herd-shadow-tail" d="M29 11 q3 2 2 6"/><rect x="12" y="15" width="3.6" height="10" rx="1.5"/><rect x="17.4" y="16" width="3.6" height="9" rx="1.5"/><rect x="22.6" y="16" width="3.6" height="9" rx="1.5"/><rect x="26.8" y="14" width="3.6" height="11" rx="1.5"/><ellipse cx="20" cy="12" rx="10" ry="7.5"/><circle cx="9" cy="10" r="6.5"/><path d="M3.4 12 q-2.8 6 0 11.8 q1.8 1 2.6 -0.6 q-1.4 -4.6 1.6 -9.2 z"/><ellipse cx="13" cy="10.5" rx="3.6" ry="5"/></svg>`;
h+=`<div class="herd" role="img" aria-label="${met} of ${GOALS} goals met today"><div class="herd-pen">${'<div class="herd-elephant">🐘</div>'.repeat(met)}${`<div class="herd-elephant">${SHADOW}</div>`.repeat(GOALS-met)}</div><span class="herd-caption">${met} of ${GOALS} goals met today</span></div>`;

// each row shows at most MAX_DOTS circles, even if more were logged.
// every serving is still saved in health-log.txt and still counts everywhere else; only the circles stop at 9.
const MAX_DOTS=9;
const dotRows=(list,cls)=>list.map(([k,g])=>{const n=c(T,k), shown=Math.min(Math.max(g,n),MAX_DOTS); let dots="";
  for(let i=0;i<shown;i++) dots+=`<div class="dot ${i<Math.min(n,g)?"dot--met "+cls:i>=g?"dot--bonus "+cls:""}"></div>`;
  return `<div class="goal-row"><span class="goal-label">${k}</span><div class="dots">${dots}</div></div>`;}).join("");

// consumables
h+=`<h2 class="section-title">consumables</h2>`+dotRows(CONSUMABLES,"");

// practices
h+=`<h2 class="section-title">practices</h2><h3 class="subsection-title">today</h3>`+dotRows(PRACTICES,"dot--practice");
const mon=addDays(today,-((today.getDay()+6)%7));
h+=`<h3 class="subsection-title">this week, since monday</h3>`;
WEEKLY.forEach(([k,g])=>{let n=0;for(let i=0;i<7;i++)n+=c(ds(addDays(mon,i)),k);
  const pct=Math.min(n/g,1)*100;
  h+=`<div class="goal-row"><span class="goal-label">${k}</span><div class="goal-progress"><div class="bar ${pct<50?"bar--low":""}"><i class="bar-fill" style="width:${pct}%"></i></div><div class="caption">${n} of ${g}</div></div></div>`;});

// today's log with times
if(todayLog.length){
  h+=`<h2 class="section-title">logged today</h2><ul class="today-log">`+todayLog.reverse().map(([t,i])=>`<li class="today-log-item"><time class="today-log-time">${esc(t)}</time><span class="today-log-name">${esc(i)}</span></li>`).join("")+`</ul>`;
}

// 30 day trend, both groups
const days=[...Array(30)].map((_,i)=>ds(addDays(today,i-29)));
const cv=days.map(d=>scoreOf(CONSUMABLES,d)), pv=days.map(d=>scoreOf(PRACTICES,d));
const W=300,H=120,bw=W/30;
const avg7=v=>v.map((_,i)=>{const s=v.slice(Math.max(0,i-6),i+1);return s.reduce((a,b)=>a+b,0)/s.length});
let svg=`<svg class="trend-chart" viewBox="0 0 ${W} ${H+16}" role="img" aria-label="consumables daily score, last 30 days">`;
[0.5,1].forEach(y=>svg+=`<line class="trend-grid" x1="0" x2="${W}" y1="${H-y*H}" y2="${H-y*H}"/>`);
cv.forEach((v,i)=>svg+=`<rect class="trend-bar" x="${i*bw+1}" y="${H-v*H}" width="${bw-2}" height="${v*H}" rx="2"/>`);
svg+=`<polyline class="trend-line trend-line--consumable" points="${avg7(cv).map((v,i)=>`${i*bw+bw/2},${H-v*H}`).join(" ")}"/>`;
svg+=`<polyline class="trend-line trend-line--practice" points="${avg7(pv).map((v,i)=>`${i*bw+bw/2},${H-v*H}`).join(" ")}"/>`;
svg+=`<text class="trend-axis-label" x="0" y="${H+13}">${days[0].slice(5)}</text><text class="trend-axis-label" x="${W}" y="${H+13}" text-anchor="end">today</text></svg>`;
h+=`<h2 class="section-title">last 30 days</h2><div class="card trend-card">${svg}<div class="caption">bars: consumables each day. solid line: consumables 7 day average. dashed line: practices 7 day average.</div></div>`;

// heatmap, last 14 days, grouped
const d14=days.slice(-14);
const hmRows=(list,color)=>list.map(([k,g])=>`<tr><td class="heatmap-label">${k}</td>`+d14.map(d=>{const f=Math.min(c(d,k)/g,1);
  return `<td class="heatmap-cell" style="${f?`background:var(${color});opacity:${.25+f*.75}`:""}"></td>`}).join("")+"</tr>").join("");
let tb=`<table class="heatmap-table"><tr><th class="heatmap-day"></th>${d14.map(d=>`<th class="heatmap-day">${+d.slice(8)}</th>`).join("")}</tr>`;
tb+=`<tr><td class="heatmap-label heatmap-group" colspan="15">consumables</td></tr>`+hmRows(CONSUMABLES,"--leaf");
tb+=`<tr><td class="heatmap-label heatmap-group" colspan="15">practices</td></tr>`+hmRows(PRACTICES,"--sky")+`</table>`;
h+=`<h2 class="section-title">last 14 days by item</h2><div class="card scroll-x heatmap-card">${tb}</div>`;

// hit rate, lowest first
const rate=list=>list.map(([k,g])=>[k,days.reduce((s,d)=>s+Math.min(c(d,k)/g,1),0)/30]).sort((a,b)=>a[1]-b[1]);
const rateRows=(list,cls)=>rate(list).map(([k,v])=>{const p=Math.round(v*100);
  return `<div class="goal-row"><span class="goal-label">${k}</span><div class="goal-progress"><div class="bar ${cls} ${p<50?"bar--low":""}"><i class="bar-fill" style="width:${p}%"></i></div><div class="caption">${p}%</div></div></div>`;}).join("");
h+=`<h2 class="section-title">30 day hit rate, lowest first</h2><h3 class="subsection-title">consumables</h3>${rateRows(CONSUMABLES,"bar--consumable")}<h3 class="subsection-title">practices</h3>${rateRows(PRACTICES,"")}`;

// anything in the log that didn't match a goal
const unk=Object.keys(unknown);
if(unk.length) h+=`<div class="warning">these log entries didn't match a goal, so they aren't counted: ${unk.map(u=>esc(u)+" ("+unknown[u]+")").join(", ")}. add a word from them to the matching goal at the top of the template.</div>`;

h+=`<p class="footnote">a dot with a + is a bonus serving past the goal. each filled elephant at the top is a finished goal.</p>`;
}
// stepper sheet
let li=0;
h+=`<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sheet-title"><div class="sheet-card">
<div class="sheet-head"><h2 class="section-title sheet-title" id="sheet-title">log servings</h2><p class="sheet-hint">tap + once per serving, up to ${MAX_SERVINGS} each.</p></div><div class="sheet-body">`+
LOG_GROUPS.map(([g,items])=>`<h3 class="subsection-title">${g}</h3>`+items.map(item=>{const i=li++;
  return `<div class="step-row" data-row="${i}"><span class="step-label">${esc(item)}</span><div class="stepper"><button type="button" class="stepper-button" data-i="${i}" data-d="-1" aria-label="one less ${esc(item)}" disabled>−</button><output class="stepper-count" aria-live="polite">0</output><button type="button" class="stepper-button" data-i="${i}" data-d="1" aria-label="one more ${esc(item)}">+</button></div></div>`;}).join("")).join("")+
`</div><div class="sheet-foot"><button type="button" class="sheet-button sheet-button--secondary" data-act="cancel">cancel</button><button type="button" class="sheet-button sheet-button--primary" data-act="ok" disabled>ok</button></div></div></div>`;

document.getElementById("app").innerHTML=h;

// show the offline notice whenever the phone has no connection
const offlineNote=document.getElementById("offline");
const syncOffline=()=>{offlineNote.hidden=navigator.onLine;};
syncOffline(); addEventListener("online",syncOffline); addEventListener("offline",syncOffline);

// if the sheet is reused and only the #d=... part of the link changes, the browser doesn't reload
// the page on its own, so it would keep showing the old report. reload so the new data is drawn.
addEventListener("hashchange",()=>location.reload());

// save a copy of this page on the phone so it opens without internet
if("serviceWorker" in navigator){navigator.serviceWorker.register("./sw.js").catch(()=>{});}

const sheet=document.getElementById("sheet");
const picks=LOG_ITEMS.map(()=>0);
const paint=()=>{
  picks.forEach((n,i)=>{const row=sheet.querySelector(`[data-row="${i}"]`);
    row.querySelector("output").textContent=n; row.classList.toggle("step-row--picked",n>0);
    row.querySelector('[data-d="-1"]').disabled=n<=0; row.querySelector('[data-d="1"]').disabled=n>=MAX_SERVINGS;});
  const total=picks.reduce((a,b)=>a+b,0), ok=sheet.querySelector('[data-act="ok"]');
  ok.disabled=total===0; ok.textContent=total?`ok (${total})`:"ok";
};
const openSheet=()=>{sheet.hidden=false;document.body.style.overflow="hidden";sheet.querySelector('[data-d="1"]').focus();};
const closeSheet=()=>{picks.fill(0);paint();sheet.hidden=true;document.body.style.overflow="";};
document.addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b) return;
  if(b.dataset.i!==undefined){const i=+b.dataset.i;picks[i]=Math.max(0,Math.min(MAX_SERVINGS,picks[i]+ +b.dataset.d));paint();return;}
  if(b.dataset.act==="open") openSheet();
  if(b.dataset.act==="cancel") closeSheet();
  if(b.dataset.act==="ok"){
    const lines=[]; picks.forEach((n,i)=>{for(let j=0;j<n;j++) lines.push(LOG_ITEMS[i]);});
    if(!lines.length) return;
    const url=`shortcuts://run-shortcut?name=${encodeURIComponent(LOGGER_NAME)}&input=text&text=${encodeURIComponent(lines.join("\n"))}`;
    closeSheet(); location.href=url;
  }
});
sheet.addEventListener("click",e=>{if(e.target===sheet) closeSheet();});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!sheet.hidden) closeSheet();});
</script>
</body>
</html>
